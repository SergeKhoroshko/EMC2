<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page 3</title>
    <link rel="stylesheet" crossorigin href="/EMC2/assets/styles-CeFPLDZ0.css">
  </head>
  <body>
    <!-- Site header with logo, navigation, burger menu, and social links -->
<header class="header">
  <div class="container">
    <div class="header-inner">
      <!-- Logo -->
      <a class="header-logo" href="./index.html" aria-label="Your Energy — home">
        <svg class="header-logo-icon" width="107" height="32" aria-hidden="true">
          <use href="/EMC2/assets/sprite-iBEEKsMx.svg#logo"></use>
        </svg>
      </a>

      <!-- Desktop navigation -->
      <nav class="header-nav" aria-label="Main navigation">
        <ul class="header-nav-list">
          <li class="header-nav-item">
            <a class="header-nav-link {=$home-active}" href="./index.html">Home</a>
          </li>
          <li class="header-nav-item">
            <a class="header-nav-link {=$favorites-active}" href="./page-2.html">Favorites</a>
          </li>
        </ul>
      </nav>

      <!-- Social links (desktop) -->
      <ul class="header-social" aria-label="Social networks">
        <li>
          <a class="header-social-link" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
            <svg width="20" height="20" aria-hidden="true"><use href="/EMC2/assets/sprite-iBEEKsMx.svg#icon-facebook"></use></svg>
          </a>
        </li>
        <li>
          <a class="header-social-link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg width="20" height="20" aria-hidden="true"><use href="/EMC2/assets/sprite-iBEEKsMx.svg#icon-instagram"></use></svg>
          </a>
        </li>
        <li>
          <a class="header-social-link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
            <svg width="20" height="20" aria-hidden="true"><use href="/EMC2/assets/sprite-iBEEKsMx.svg#icon-youtube"></use></svg>
          </a>
        </li>
      </ul>

      <!-- Burger button (mobile only) -->
      <button class="burger-btn" id="burgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
        <svg width="28" height="28" aria-hidden="true"><use href="/EMC2/assets/sprite-iBEEKsMx.svg#icon-menu"></use></svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu overlay -->
  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <div class="mobile-menu-inner">
      <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Close menu">
        <svg width="28" height="28" aria-hidden="true"><use href="/EMC2/assets/sprite-iBEEKsMx.svg#icon-close"></use></svg>
      </button>

      <nav class="mobile-nav" aria-label="Mobile navigation">
        <ul class="mobile-nav-list">
          <li><a class="mobile-nav-link {=$home-active}" href="./index.html">Home</a></li>
          <li><a class="mobile-nav-link {=$favorites-active}" href="./page-2.html">Favorites</a></li>
        </ul>
      </nav>

      <ul class="mobile-social" aria-label="Social networks">
        <li>
          <a class="header-social-link" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
            <svg width="24" height="24" aria-hidden="true"><use href="/EMC2/assets/sprite-iBEEKsMx.svg#icon-facebook"></use></svg>
          </a>
        </li>
        <li>
          <a class="header-social-link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg width="24" height="24" aria-hidden="true"><use href="/EMC2/assets/sprite-iBEEKsMx.svg#icon-instagram"></use></svg>
          </a>
        </li>
        <li>
          <a class="header-social-link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
            <svg width="24" height="24" aria-hidden="true"><use href="/EMC2/assets/sprite-iBEEKsMx.svg#icon-youtube"></use></svg>
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>


    <main>
      <div class="container">
        <h1 class="main-title">
          <span class="main-title-gradient">Welcome</span> to page 3
        </h1>
        <a class="back-link" href="./index.html">Go back</a>

      </div>
    </main>

    <!-- Site footer with logo, slogan, social links, and email subscription -->
<footer class="footer">
  <div class="container">
    <div class="footer-top">
      <!-- Left: logo + tagline -->
      <div class="footer-brand">
        <a class="footer-logo" href="./index.html" aria-label="Your Energy — home">
          <svg width="107" height="32" aria-hidden="true">
            <use href="/EMC2/assets/sprite-iBEEKsMx.svg#logo"></use>
          </svg>
        </a>
        <p class="footer-slogan">
          Energize your life,<br />one workout at a time.
        </p>
      </div>

      <!-- Right: social links + subscription -->
      <div class="footer-right">
        <p class="footer-social-label">Follow us</p>
        <ul class="footer-social" aria-label="Social networks">
          <li>
            <a class="footer-social-link" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
              <svg width="20" height="20" aria-hidden="true"><use href="/EMC2/assets/sprite-iBEEKsMx.svg#icon-facebook"></use></svg>
            </a>
          </li>
          <li>
            <a class="footer-social-link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <svg width="20" height="20" aria-hidden="true"><use href="/EMC2/assets/sprite-iBEEKsMx.svg#icon-instagram"></use></svg>
            </a>
          </li>
          <li>
            <a class="footer-social-link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
              <svg width="20" height="20" aria-hidden="true"><use href="/EMC2/assets/sprite-iBEEKsMx.svg#icon-youtube"></use></svg>
            </a>
          </li>
        </ul>

        <!-- Email subscription form -->
        <form class="subscribe-form" id="subscribeForm" novalidate>
          <label class="subscribe-label" for="subscribeEmail">Subscribe for updates</label>
          <div class="subscribe-row">
            <input
              class="subscribe-input"
              id="subscribeEmail"
              type="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
            <button class="subscribe-btn" type="submit">Subscribe</button>
          </div>
          <p class="subscribe-msg" id="subscribeMsg" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <div class="footer-bottom">
      <p class="footer-copy">&copy; <span id="footerYear"></span> Your Energy. All rights reserved.</p>
    </div>
  </div>
</footer>

  </body>
</html>
