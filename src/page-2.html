<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your Energy — your favorite fitness exercises saved for quick access." />
    <title>Favorites — Your Energy</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- Header with active Favorites link -->
    <load src="./partials/header.html" favorites-active="active" />

    <main>
      <!-- ===== FAVORITES SECTION ===== -->
      <section class="favorites-section">
        <div class="container">
          <h1 class="favorites-title">Favorites</h1>

          <!-- Exercise cards populated from localStorage -->
          <ul class="cards-grid" id="favoritesGrid" aria-live="polite" aria-label="Favorite exercises"></ul>

          <!-- Empty state when no favorites saved -->
          <div class="favorites-empty" id="favoritesEmpty" hidden>
            <p class="favorites-empty-text">
              Your favorites list is empty.<br />
              <a class="favorites-empty-link" href="./index.html">Browse exercises</a> and add ones you love!
            </p>
          </div>
        </div>
      </section>
    </main>

    <load src="./partials/footer.html" />

    <!-- ===== EXERCISE DETAIL MODAL ===== -->
    <div class="modal-backdrop" id="exerciseModalBackdrop" aria-modal="true" role="dialog" aria-labelledby="exModalTitle" hidden>
      <div class="modal exercise-modal" id="exerciseModal">
        <button class="modal-close-btn" id="exerciseModalClose" type="button" aria-label="Close modal">
          <svg width="24" height="24" aria-hidden="true"><use href="./img/sprite.svg#icon-close"></use></svg>
        </button>

        <div class="ex-modal-media">
          <img class="ex-modal-gif" id="exModalGif" alt="" loading="lazy" />
        </div>

        <div class="ex-modal-body">
          <div class="ex-modal-header">
            <h2 class="ex-modal-title" id="exModalTitle" aria-label="Exercise name"></h2>
            <div class="ex-modal-rating-row">
              <span class="ex-modal-rating-val" id="exModalRating"></span>
              <svg class="ex-modal-star" width="16" height="16" aria-hidden="true"><use href="./img/sprite.svg#icon-star"></use></svg>
            </div>
          </div>

          <ul class="ex-modal-meta">
            <li class="ex-modal-meta-item">
              <span class="ex-modal-meta-label">Body part</span>
              <span class="ex-modal-meta-val" id="exModalBodyPart"></span>
            </li>
            <li class="ex-modal-meta-item">
              <span class="ex-modal-meta-label">Target</span>
              <span class="ex-modal-meta-val" id="exModalTarget"></span>
            </li>
            <li class="ex-modal-meta-item">
              <span class="ex-modal-meta-label">Equipment</span>
              <span class="ex-modal-meta-val" id="exModalEquipment"></span>
            </li>
            <li class="ex-modal-meta-item">
              <span class="ex-modal-meta-label">Popularity</span>
              <span class="ex-modal-meta-val" id="exModalPopularity"></span>
            </li>
            <li class="ex-modal-meta-item">
              <span class="ex-modal-meta-label">Burned calories</span>
              <span class="ex-modal-meta-val" id="exModalCalories"></span>
            </li>
          </ul>

          <p class="ex-modal-desc" id="exModalDesc"></p>

          <div class="ex-modal-actions">
            <button class="btn btn-outline" id="exModalFavBtn" type="button">
              Remove from favorites
              <svg width="18" height="18" aria-hidden="true"><use href="./img/sprite.svg#icon-trash"></use></svg>
            </button>
            <button class="btn btn-accent" id="exModalRateBtn" type="button">Give a rating</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== RATING MODAL ===== -->
    <div class="modal-backdrop" id="ratingModalBackdrop" aria-modal="true" role="dialog" aria-labelledby="ratingModalTitle" hidden>
      <div class="modal rating-modal" id="ratingModal">
        <button class="modal-close-btn" id="ratingModalClose" type="button" aria-label="Close rating modal">
          <svg width="24" height="24" aria-hidden="true"><use href="./img/sprite.svg#icon-close"></use></svg>
        </button>

        <h2 class="rating-modal-title" id="ratingModalTitle">Rate this exercise</h2>

        <form class="rating-form" id="ratingForm" novalidate>
          <fieldset class="rating-stars" id="ratingStars">
            <legend class="sr-only">Choose a rating from 1 to 5</legend>
            <label class="star-label" title="1 star">
              <input class="star-input sr-only" type="radio" name="rate" value="1" required />
              <svg width="32" height="32" aria-hidden="true"><use href="./img/sprite.svg#icon-star"></use></svg>
            </label>
            <label class="star-label" title="2 stars">
              <input class="star-input sr-only" type="radio" name="rate" value="2" />
              <svg width="32" height="32" aria-hidden="true"><use href="./img/sprite.svg#icon-star"></use></svg>
            </label>
            <label class="star-label" title="3 stars">
              <input class="star-input sr-only" type="radio" name="rate" value="3" />
              <svg width="32" height="32" aria-hidden="true"><use href="./img/sprite.svg#icon-star"></use></svg>
            </label>
            <label class="star-label" title="4 stars">
              <input class="star-input sr-only" type="radio" name="rate" value="4" />
              <svg width="32" height="32" aria-hidden="true"><use href="./img/sprite.svg#icon-star"></use></svg>
            </label>
            <label class="star-label" title="5 stars">
              <input class="star-input sr-only" type="radio" name="rate" value="5" />
              <svg width="32" height="32" aria-hidden="true"><use href="./img/sprite.svg#icon-star"></use></svg>
            </label>
          </fieldset>

          <label class="rating-field-label" for="ratingEmail">Your email <span aria-hidden="true">*</span></label>
          <input
            class="rating-input"
            id="ratingEmail"
            type="email"
            name="email"
            placeholder="email@example.com"
            autocomplete="email"
            required
          />
          <p class="rating-error" id="ratingEmailError" aria-live="polite"></p>

          <label class="rating-field-label" for="ratingReview">Comment (optional)</label>
          <textarea
            class="rating-input rating-textarea"
            id="ratingReview"
            name="review"
            placeholder="Share your thoughts…"
            rows="3"
          ></textarea>

          <button class="btn btn-accent rating-submit" type="submit">Send</button>
        </form>
      </div>
    </div>

    <script type="module" src="./page-2.js"></script>
  </body>
</html>
